; main.py の設定ファイル（main.py と同じフォルダに置く）
; パスワードは、このファイルに書かない。環境変数 DB_PASSWORD で渡す（未設定ならパスワードなし）

[database]
host = localhost
port = 5432
name = python_study
user = macbook

[batch]
; 登録先テーブル
table_name = orders_practice
; 引数を省略したときの入力CSV
default_csv_path = new_users.csv
; ログファイル
log_path = process.log
; 重複判定に使う項目
key_column = order_id
; 却下した行を出すCSVの名前の前半（実行日時が付く。例：reject_20261009_091500.csv）
reject_prefix = reject
; 入力CSVの文字コード。utf-8-sig = UTF-8（BOMあり・なし両方読める）、cp932 = Shift_JIS（Windows）
csv_encoding = utf-8-sig
